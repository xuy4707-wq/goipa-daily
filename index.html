      + '<div class="card-open"><span>▸ 点击查看详情</span>'+(it.m?'<span class="has-m">📷 有官方截图</span>':'')+'</div></div>';
  }).join('');
  emptyEl.style.display = list.length ? 'none' : 'block';
  info.innerHTML = '显示 <b>'+list.length+'</b> / '+DATA.length+' 个' + (kw ? ' · 关键词「'+esc(state.kw)+'」' : '');
}

grid.addEventListener('click', e => {
  const c = e.target.closest('.card');
  if (c) openDetail(parseInt(c.dataset.i));
});

const q = document.getElementById('q');
q.addEventListener('input', () => { state.kw = q.value; render(); });
document.getElementById('clear').onclick = () => { q.value=''; state.kw=''; render(); q.focus(); };
document.addEventListener('keydown', e => {
  if (e.key==='/' && document.activeElement!==q){ e.preventDefault(); q.focus(); }
  if (e.key==='Escape'){ closeDetail(); q.value=''; state.kw=''; render(); }
});
const topBtn = document.getElementById('top-btn');
topBtn.onclick = () => window.scrollTo({top:0,behavior:'smooth'});
window.addEventListener('scroll', () => topBtn.style.display = scrollY>400 ? 'block':'none');

/* ── 运行时 JSONP 降级（仅未预匹配的应用） ── */
let jpSeq = 0;
function itunesSearch(term, country, cb){
  const id = '_itcb' + (++jpSeq);
  const s = document.createElement('script');
  let done = false;
  const fin = (data) => { if(done) return; done = true; try{ delete window[id]; }catch(e){} s.remove(); cb(data); };
  window[id] = d => fin(d);
  s.onerror = () => fin(null);
  setTimeout(() => fin(null), 9000);
  s.src = 'https://itunes.apple.com/search?term=' + encodeURIComponent(term) +
          '&entity=software&limit=10&country=' + country + '&callback=' + id;
  document.head.appendChild(s);
}
const norm = s => String(s||'').replace(/[^\w\u4e00-\u9fff]+/g,'').toLowerCase();
function rscore(term, cand){
  const t = norm(term), c = norm(cand);
  if (!t || !c) return 0;
  if (t === c) return 100;
  if (c.startsWith(t) || (t.includes(c) === false && c.includes(t) && t.length >= 2)) return Math.max(40, 85 - Math.abs(c.length-t.length)*2);
  if (c.length >= 2 && t.includes(c)) return Math.max(40, 75 - Math.abs(t.length-c.length)*2);
  const tw = t.split(/\s+/), cw = c.split(/\s+/);
  if (tw.length && cw.length){ const j = tw.filter(x=>cw.includes(x)).length / (tw.length+cw.length); if (j >= 0.4) return Math.floor(60 + j*20); }
  return 0;
}
function cleanName(n){
  let s = n.replace(/【[^】]*】/g,' ').split(/[-–—:：]/)[0];
  s = s.replace(/(多开|美化|纯净|官替|砸壳|破解|解锁|需授权|内购|免拨卡|去水印|修改器|汉化|辅助|国际服|国服|日服|韩服|台服|台湾服|越南服|整合包|第三方|开心版|端游移植|内置IGG|官方版|正式版)/g,' ');
  s = s.replace(/[（(][^）)]*[）)]/g,' ').replace(/\s+/g,' ').trim();
  return s || n.trim();
}

/* ── 详情弹窗 ── */
const overlay = document.getElementById('overlay');
const modal = document.getElementById('modal');
function closeDetail(){ overlay.classList.remove('show'); modal.innerHTML=''; }
overlay.addEventListener('click', e => { if (e.target === overlay) closeDetail(); });

function shotsHtml(m){
  return '<div class="shots">' + m.sh.slice(0,8).map(u => '<img loading="lazy" src="'+esc(u)+'" alt="截图">').join('') + '</div>'
    + '<div class="shots-note">截图来自 App Store「'+esc(m.nm)+'」（'+esc(m.ar||'')+'）· '+esc(m.cc||'')+'区匹配 '+m.id+' · 破解版基于此原版修改</div>';
}

function renderModal(it, idx){
  const cc = catColor(it.t);
  const sz = fmtSize(it.s);
  modal.innerHTML =
    '<div class="m-head">'
    + '<button class="m-close" id="mclose">✕</button>'
    + '<div class="m-title-row">'
    + '<div class="m-icon" id="m-icon" style="background:'+(it.col||'var(--acc)')+'">'+esc(it.n.trim()[0]||'?')+'</div>'
    + '<div class="m-titles"><div class="m-name">'+esc(it.n)+'</div>'
    + (it.sub ? '<div class="m-sub">'+esc(it.sub)+'</div>' : '')
    + '<div class="m-badges"><span class="badge v">v'+esc(it.v)+'</span>'
    + '<span class="badge cat" style="--cc:'+cc+';color:'+cc+'">'+CAT_MAP[it.t]+(it.c?' · '+esc(it.c):'')+'</span>'
    + (sz?'<span class="badge">'+sz+'</span>':'')
    + '<span class="badge">更新 '+esc('2026-11-16')+'</span>'
    + (it.lock==='1'?'<span class="badge" style="color:#fbbf24">需解锁</span>':'')
    + '</div></div></div></div>'
    + '<div class="m-body">'
    + (it.ld ? '<div class="m-sec"><h3>应用介绍</h3><div class="m-intro">'+esc(it.ld)+'</div></div>' : '')
    + (it.d ? '<div class="m-sec"><h3>破解 / 版本说明</h3><div class="m-hack">'+esc(it.d)+'</div></div>' : '')
    + '<div class="m-sec"><h3>官方截图（App Store 原版）</h3><div id="shots-box">'
    + (it.m ? shotsHtml(it.m) : '<div class="shot-loading"><span class="spin"></span>正在搜索原版应用截图…</div>')
    + '</div></div>'
    + '<div class="m-sec"><h3>相关链接</h3><div class="m-links" id="m-links"></div></div>'
    + '</div>';
  overlay.classList.add('show');
  document.getElementById('mclose').onclick = closeDetail;
  const iconEl = document.getElementById('m-icon');
  const linksEl = document.getElementById('m-links');
  if (it.dl) {
    linksEl.innerHTML += '<a class="m-btn pri" target="_blank" rel="noopener" href="'+esc(it.dl)+'">⬇ 下载 IPA'+(it.lz==='1'?'（蓝奏云）':'')+'</a>';
  }
  if (it.m) {
    iconEl.innerHTML = '<img src="'+esc(it.m.art)+'" alt="">';
    linksEl.innerHTML += '<a class="m-btn" target="_blank" rel="noopener" href="'+esc(it.m.url)+'">App Store 原版页面</a>';
  } else {
    linksEl.innerHTML += '<span class="m-empty-link">IPA 在源站内（需通过签名工具安装本源）</span>';
    // 运行时 JSONP 补救
    const term = cleanName(it.n);
    const box = document.getElementById('shots-box');
    const tryC = (country) => {
      itunesSearch(term, country, data => {
        const rs = data && data.results ? data.results : [];
        let pick = null, best = 55;
        for (const r of rs) {
          if (!r.screenshotUrls || !r.screenshotUrls.length) continue;
          const sc = rscore(term, r.trackName);
          if (sc > best) { best = sc; pick = r; }
        }
        if (pick) {
          const m = {sh: pick.screenshotUrls.slice(0,8), nm: pick.trackName, ar: pick.artistName, art: pick.artworkUrl512||pick.artworkUrl100, url: pick.trackViewUrl, cc: country, id: ''};
          box.innerHTML = shotsHtml(m);
          iconEl.innerHTML = '<img src="'+esc(m.art)+'" alt="">';
          linksEl.innerHTML += '<a class="m-btn" target="_blank" rel="noopener" href="'+esc(m.url)+'">App Store 原版页面</a>';
        } else if (country === 'CN') { tryC('US'); }
        else if (country === 'US') { tryC('JP'); }
        else {
          box.innerHTML = '<div class="m-empty-link">未匹配到原版截图，<a target="_blank" rel="noopener" href="https://apps.apple.com/cn/search?term='+encodeURIComponent(term)+'">点此在 App Store 搜索「'+esc(term)+'」查看</a></div>';
        }
      });
    };
    tryC('CN');
  }
}

function openDetail(i){ const it = DATA[i]; if (it) renderModal(it, i); }

renderChips(); renderPills(); render();
