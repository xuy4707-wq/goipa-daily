.search input:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(99,102,241,.18)}

.search input:not(:placeholder-shown) ~ .clear{display:block}
.pills{display:flex;gap:6px;flex-wrap:wrap}

.pill.srcp.canmore.on{background:var(--sc);border-color:var(--sc)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;

.card-top{display:flex;align-items:flex-start;gap:8px}

mark{background:rgba(250,204,21,.28);color:#fde68a;border-radius:3px;padding:0 1px}

.overlay{position:fixed;inset:0;background:rgba(4,6,12,.72);backdrop-filter:blur(4px);

  if (FAVS[it.n]) { delete FAVS[it.n]; toastMsg('已取消收藏'); }
  else { FAVS[it.n] = snap(it); toastMsg('已收藏 ✨'); }
  saveFavs();
}
const grid = document.getElementById('grid');
const info = document.getElementById('info');
const emptyEl = document.getElementById('empty');
const moreBtn = document.getElementById('more');

function catColor(t){ return getComputedStyle(document.documentElement).getPropertyValue('--c'+t).trim() || '#3a4157'; }

/* ── 副标与统计条 ── */
(function(){
  let h = '共 <b>'+DATA.length+'</b> 个应用（同名同版本已合并去重）· 点击卡片看<b>介绍与官方截图</b> · 点 ⭐ 收藏<br>'
    + '<span class="sg">🅖 goipa 源 '+SOURCES.goipa.date+' 批次 '+SOURCES.goipa.count+' 个</span> · '
    + '<span class="sc">🅒 canmore 源 '+SOURCES.canmore.date+' 批次 '+SOURCES.canmore.count+' 个</span>';
  if (SOURCES.goipa.date !== SOURCES.canmore.date) h += ' · 两源发布节奏不同，日期角标见卡片';
  document.getElementById('src-sub').innerHTML = h;
})();

function renderChips(){
  document.getElementById('chips').innerHTML = CATS.map(c =>
    '<div class="chip"><span class="dot" style="background:'+catColor(c.id)+'"></span>'+c.label+' <b>'+c.count+'</b></div>').join('')
    + '<div class="chip"><span class="dot" style="background:#818cf8"></span>goipa <b>'+SOURCES.goipa.count+'</b></div>'
    + '<div class="chip"><span class="dot" style="background:#22d3ee"></span>canmore <b>'+SOURCES.canmore.count+'</b></div>'
    + '<div class="chip"><span class="dot" style="background:#a78bfa"></span>合计 <b>'+DATA.length+'</b></div>';
}

function renderPills(){
  const p = document.getElementById('pills');
  const dual = SOURCES.goipa.date !== SOURCES.canmore.date;
  p.innerHTML = '<div class="pill favpill'+(state.view==='favs'?' on':'')+'" data-view="favs">★ 收藏 <small>'+favCount()+'</small></div>'
    + '<div class="pill'+(state.view!=='favs'&&state.cat==='all'&&state.src==='all'?' on':'')+'" data-cat="all" data-src="all">全部 <small>'+DATA.length+'</small></div>'
    + '<div class="pill srcp goipa'+(state.view!=='favs'&&state.src==='goipa'?' on':'')+'" data-src="goipa" data-cat="all" title="'+SOURCES.goipa.date+' 批次">🅖 goipa <small>'+SOURCES.goipa.count+'</small></div>'
    + '<div class="pill srcp canmore'+(state.view!=='favs'&&state.src==='canmore'?' on':'')+'" data-src="canmore" data-cat="all" title="'+SOURCES.canmore.date+' 批次">🅒 canmore <small>'+SOURCES.canmore.count+'</small></div>'
    + '<div class="pill-sep"></div>'
    + CATS.map(c => '<div class="pill'+(state.view!=='favs'&&state.cat===c.id&&state.src==='all'?' on':'')+'" data-cat="'+c.id+'" data-src="all">'+c.label+' <small>'+c.count+'</small></div>').join('');
  p.querySelectorAll('.pill').forEach(el => el.onclick = () => {
    if (el.dataset.view){ state.view = 'favs'; }
    else {
      state.view = 'today';
      if (el.dataset.src) state.src = el.dataset.src;
      if (el.dataset.cat) state.cat = el.dataset.cat;
      if (el.dataset.src) state.cat = 'all';
      else if (el.dataset.cat) state.src = 'all';
    }
    renderPills(); render(true);
  });
}

/* ── 应用图标（源站 iconURL 优先 → iTunes 兜底 → 首字母保底）── */
function appIcon(it){
  const u = [];
  if (it.ico) u.push(it.ico);
  if (it.m && it.m.art && it.m.art !== u[0]) u.push(it.m.art);
  if (!u.length) return '';
  return '<img loading="lazy" src="'+esc(u[0])+'"'+(u[1]?' data-fb="'+esc(u[1])+'"':'')+' alt="">';
}
function cardIcon(it, cc){
  return '<div class="card-ico" style="background:'+(it.col||cc)+'">'+esc((String(it.n||'').trim()[0])||'?')+appIcon(it)+'</div>';
}
document.addEventListener('error', function(e){
  const t = e.target;
  if (!(t && t.tagName === 'IMG' && t.closest('.card-ico,.m-icon'))) return;
  if (t.dataset.fb){ const f = t.dataset.fb; delete t.dataset.fb; t.src = f; }
  else t.remove();
}, true);

const CHUNK = 400;
let shown = 0;
function getList(){
  const src = state.view==='favs' ? Object.values(FAVS) : DATA;
  const kw = state.kw.trim().toLowerCase();
  return src.filter(it =>
    (state.view==='favs' || state.cat==='all' || it.t===state.cat) &&
    (state.view==='favs' || state.src==='all' || (it.srcs||[]).includes(state.src)) &&
    (!kw || (it.n+' '+it.v+' '+(it.dt||'')+' '+it.d+' '+(it.ld||'')).toLowerCase().includes(kw)));
}
function cardHtml(it, kw){
  const cc = catColor(it.t);
  const uid = 'u'+(++uidSeq); UID[uid] = it;
  const favd = !!FAVS[it.n];
  const size = fmtSize(it.s);
  return '<div class="card'+(favd?' faved':'')+'" style="--cc:'+cc+'" data-uid="'+uid+'">'
    + '<div class="card-head">'+cardIcon(it, cc)+'<div class="card-head-main">'
    + '<div class="card-top"><div class="card-name">'+hi(it.n, kw)+'</div>'
    + '<button class="fav-btn'+(favd?' on':'')+'" data-fav-uid="'+uid+'" title="'+(favd?'取消收藏':'收藏')+'">★</button>'
    + '<span class="card-ver">v'+hi(it.v, kw)+'</span></div>'
    + '<div class="card-meta"><span><span class="src-tags">'+srcDot(it)+'</span> <span class="tag">'+CAT_MAP[it.t]+'</span>'+((it.c && it.c !== CAT_MAP[it.t])?' · '+esc(it.c):'')+'</span>'+(size?'<span>'+size+'</span>':'')+'</div>'
    + '</div></div>'
    + '<div class="card-desc">'+hi(it.d, kw)+'</div>'
    + '<div class="card-open"><span>▸ 点击查看详情</span>'+(it.m?'<span class="has-m">📷 有官方截图</span>':'')+'</div></div>';
}
function render(reset){
  if (reset){ shown = 0; grid.innerHTML = ''; }
  const kw = state.kw.trim().toLowerCase();
  const list = getList();
  const next = list.slice(shown, shown + CHUNK);
  grid.insertAdjacentHTML('beforeend', next.map(it => cardHtml(it, kw)).join(''));
  shown += next.length;
  const noResult = list.length === 0;
  emptyEl.style.display = (noResult && state.view!=='favs') ? 'block' : 'none';
  document.getElementById('fav-empty').style.display = (noResult && state.view==='favs' && !kw) ? 'block' : 'none';
  moreBtn.style.display = shown < list.length ? 'block' : 'none';
  if (shown < list.length) moreBtn.textContent = '加载更多（还有 '+(list.length-shown)+' 个 / 共 '+list.length+'）';
  const srcLabel = state.view==='favs' ? '★ 我的收藏' :
    (state.src==='goipa' ? '🅖 goipa 源' : state.src==='canmore' ? '🅒 canmore 源' : '全部来源')
    + (state.cat==='all' ? '' : ' · '+CAT_MAP[state.cat]);
  info.innerHTML = srcLabel+' · 显示 <b>'+shown+'</b> / '+list.length+' 个' + (kw ? ' · 关键词「'+esc(state.kw)+'」' : '');
}
moreBtn.onclick = () => render(false);

grid.addEventListener('click', e => {
  const fb = e.target.closest('.fav-btn');
  if (fb){ const it = UID[fb.dataset.favUid]; toggleFav(it); renderPills(); render(true); if (curIt) syncModalFav(); return; }
  const c = e.target.closest('.card');
  if (c) openDetail(UID[c.dataset.uid]);
});

const q = document.getElementById('q');
q.addEventListener('input', () => { state.kw = q.value; render(true); });
document.getElementById('clear').onclick = () => { q.value=''; state.kw=''; render(true); q.focus(); };
document.addEventListener('keydown', e => {
  if (e.key==='/' && document.activeElement!==q){ e.preventDefault(); q.focus(); }
  if (e.key==='Escape'){ closeDetail(); q.value=''; state.kw=''; render(true); }
});
const topBtn = document.getElementById('top-btn');
topBtn.onclick = () => window.scrollTo({top:0,behavior:'smooth'});
window.addEventListener('scroll', () => topBtn.style.display = scrollY>400 ? 'block':'none');

/* ── 运行时 JSONP 降级（仅未预匹配的应用） ── */
let jpSeq = 0;
function itunesSearch(term, country, cb){
  const id = '_itcb' + (++jpSeq);
  const s = document.createElement('script');
  let done = false;
  const fin = (data) => { if(done) return; done = true; try{ delete window[id]; }catch(e){} s.remove(); cb(data); };
  window[id] = d => fin(d);
  s.onerror = () => fin(null);
  setTimeout(() => fin(null), 9000);
  s.src = 'https://itunes.apple.com/search?term=' + encodeURIComponent(term) +
          '&entity=software&limit=10&country=' + country + '&callback=' + id;
  document.head.appendChild(s);
}
const norm = s => String(s||'').replace(/[^\w\u4e00-\u9fff]+/g,'').toLowerCase();
function rscore(term, cand){
  const t = norm(term), c = norm(cand);
  if (!t || !c) return 0;
  if (t === c) return 100;
  if (c.startsWith(t) || (t.includes(c) === false && c.includes(t) && t.length >= 2)) return Math.max(40, 85 - Math.abs(c.length-t.length)*2);
  if (c.length >= 2 && t.includes(c)) return Math.max(40, 75 - Math.abs(t.length-c.length)*2);
  const tw = t.split(/\s+/), cw = c.split(/\s+/);
  if (tw.length && cw.length){ const j = tw.filter(x=>cw.includes(x)).length / (tw.length+cw.length); if (j >= 0.4) return Math.floor(60 + j*20); }
  return 0;
}
function cleanName(n){
  let s = n.replace(/【[^】]*】/g,' ').split(/[-–—:：]/)[0];
  s = s.replace(/(多开|美化|纯净|官替|砸壳|破解|解锁|需授权|内购|免拨卡|去水印|修改器|汉化|辅助|国际服|国服|日服|韩服|台服|台湾服|越南服|整合包|第三方|开心版|端游移植|内置IGG|官方版|正式版)/g,' ');
  s = s.replace(/[（(][^）)]*[）)]/g,' ').replace(/\s+/g,' ').trim();
  return s || n.trim();
}

/* ── 详情弹窗 ── */
const overlay = document.getElementById('overlay');
const modal = document.getElementById('modal');
function closeDetail(){ overlay.classList.remove('show'); modal.innerHTML=''; curIt = null; }
let curIt = null;
function favBtnHtml(it){
  const f = FAVS[it.n];
  if (!f) return '<button class="m-fav not" id="m-fav">☆ 收藏这个应用</button>';
  if (f.v !== it.v) return '<button class="m-fav" id="m-fav">★ 已收藏 v'+esc(f.v)+' · 点此更新到 v'+esc(it.v)+'</button>';
  return '<button class="m-fav" id="m-fav">★ 已收藏 ✓（点击取消）</button>';
}
function syncModalFav(){
  if (!curIt) return;
  const old = document.getElementById('m-fav');
  if (old) old.outerHTML = favBtnHtml(curIt);
  const nb = document.getElementById('m-fav');
  if (nb) nb.onclick = modalFavAction;
}
function modalFavAction(){
  if (!curIt) return;
  const f = FAVS[curIt.n];
  if (!f){ toggleFav(curIt); }
  else if (f.v !== curIt.v){ FAVS[curIt.n] = snap(curIt); saveFavs(); toastMsg('收藏已更新 → v'+curIt.v); }
  else { toggleFav(curIt); }
  renderPills(); render(true); syncModalFav();
}
overlay.addEventListener('click', e => { if (e.target === overlay) closeDetail(); });

function shotsHtml(m){
  var note;
  if (m.cc === 'Steam') {
    note = '截图来自 Steam 商店页《'+esc(m.nm)+'》（'+esc(m.ar||'')+'）· 端游移植版参考画面';
  } else if (m.cc === 'GitHub') {
    note = '截图来自开源仓库 '+esc(m.nm)+' 的 README · 点击卡片链接可查看源码';
  } else {
    note = '截图来自 App Store「'+esc(m.nm)+'」（'+esc(m.ar||'')+'）· '+esc(m.cc||'')+'区匹配 '+m.id+' · 破解版基于此原版修改';
  }
  return '<div class="shots">' + m.sh.slice(0,8).map(u => '<img loading="lazy" src="'+esc(u)+'" onerror="this.remove()" alt="截图">').join('') + '</div>'
    + '<div class="shots-note">'+note+'</div>';
}

function renderModal(it, idx){
  curIt = it;
  const cc = catColor(it.t);
  const sz = fmtSize(it.s);
  modal.innerHTML =
    '<div class="m-head">'
    + '<button class="m-close" id="mclose">✕</button>'
    + '<div class="m-title-row">'
    + '<div class="m-icon" id="m-icon" style="background:'+(it.col||'var(--acc)')+'">'+esc(it.n.trim()[0]||'?')+appIcon(it)+'</div>'
    + '<div class="m-titles"><div class="m-name">'+esc(it.n)+'</div>'
    + (it.sub ? '<div class="m-sub">'+esc(it.sub)+'</div>' : '')
    + '<div class="m-badges"><span class="badge v">v'+esc(it.v)+'</span>'
    + srcBadge(it)
    + '<span class="badge cat" style="--cc:'+cc+';color:'+cc+'">'+CAT_MAP[it.t]+((it.c && it.c !== CAT_MAP[it.t])?' · '+esc(it.c):'')+'</span>'
    + (sz?'<span class="badge">'+sz+'</span>':'')
    + '<span class="badge">更新 '+esc(it.dt||'')+'</span>'
    + (it.lock==='1'?'<span class="badge" style="color:#fbbf24">需解锁</span>':'')
    + '</div></div></div></div>'
    + '<div class="m-body">'
    + (it.ld ? '<div class="m-sec"><h3>应用介绍</h3><div class="m-intro">'+esc(it.ld)+'</div></div>' : '')
    + (it.d ? '<div class="m-sec"><h3>破解 / 版本说明</h3><div class="m-hack">'+esc(it.d)+'</div></div>' : '')
    + '<div class="m-sec"><h3>官方截图（App Store 原版）</h3><div id="shots-box">'
    + (it.m ? shotsHtml(it.m) : '<div class="shot-loading"><span class="spin"></span>正在搜索原版应用截图…</div>')
    + '</div></div>'
    + '<div class="m-sec"><h3>相关链接</h3><div class="m-links" id="m-links">'+favBtnHtml(it)+'</div></div>'
    + '</div>';
  overlay.classList.add('show');
  document.getElementById('mclose').onclick = closeDetail;
  const favBtnEl = document.getElementById('m-fav');
  if (favBtnEl) favBtnEl.onclick = modalFavAction;
  const iconEl = document.getElementById('m-icon');
  const linksEl = document.getElementById('m-links');
  if (it.dl) {
    linksEl.innerHTML += '<a class="m-btn pri" target="_blank" rel="noopener" href="'+esc(it.dl)+'">⬇ 下载 IPA'+(it.lz==='1'?'（蓝奏云）':'')+'</a>';
  }
  if (it.m) {
    var linkTxt = it.m.cc === 'Steam' ? 'Steam 商店页面' : (it.m.cc === 'GitHub' ? 'GitHub 开源仓库' : 'App Store 原版页面');
    linksEl.innerHTML += '<a class="m-btn" target="_blank" rel="noopener" href="'+esc(it.m.url)+'">'+linkTxt+'</a>';
  } else {
    linksEl.innerHTML += '<span class="m-empty-link">IPA 在源站内（需通过签名工具添加源后安装）</span>';
    const term = cleanName(it.n);
    const box = document.getElementById('shots-box');
    const tryC = (country) => {
      itunesSearch(term, country, data => {
        const rs = data && data.results ? data.results : [];
        let pick = null, best = 55;
        for (const r of rs) {
          if (!r.screenshotUrls || !r.screenshotUrls.length) continue;
          const sc = rscore(term, r.trackName);
          if (sc > best) { best = sc; pick = r; }
        }
        if (pick) {
          const m = {sh: pick.screenshotUrls.slice(0,8), nm: pick.trackName, ar: pick.artistName, art: pick.artworkUrl512||pick.artworkUrl100, url: pick.trackViewUrl, cc: country, id: ''};
          box.innerHTML = shotsHtml(m);
          if (!iconEl.querySelector('img')) iconEl.innerHTML = '<img src="'+esc(m.art)+'" alt="">';
          var lt = m.cc === 'Steam' ? 'Steam 商店页面' : (m.cc === 'GitHub' ? 'GitHub 开源仓库' : 'App Store 原版页面');
          linksEl.innerHTML += '<a class="m-btn" target="_blank" rel="noopener" href="'+esc(m.url)+'">'+lt+'</a>';
        } else if (country === 'CN') { tryC('US'); }
        else if (country === 'US') { tryC('JP'); }
        else {
          box.innerHTML = '<div class="m-empty-link">未匹配到原版截图，<a target="_blank" rel="noopener" href="https://apps.apple.com/cn/search?term='+encodeURIComponent(term)+'">点此在 App Store 搜索「'+esc(term)+'」查看</a></div>';
        }
      });
    };
    tryC('CN');
  }
}

function openDetail(it){ if (it) renderModal(it); }

/* ── 导出 / 导入 ── */
document.getElementById('btn-export').onclick = () => {
  const n = favCount();
  if (!n){ toastMsg('还没有收藏，无内容可导出'); return; }
  const txt = JSON.stringify(FAVS);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([txt], {type:'application/json'}));
  a.download = 'goipa收藏备份_'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>toastMsg('已导出 '+n+' 条（文件+剪贴板）')).catch(()=>toastMsg('已导出 '+n+' 条（下载文件）'));
  } else toastMsg('已导出 '+n+' 条（下载文件）');
};
document.getElementById('btn-import').onclick = () => {
  const s = prompt('粘贴之前导出的收藏JSON（手机/电脑同步）：');
  if (!s) return;
  try {
    const d = JSON.parse(s.trim());
    let cnt = 0;
    for (const k in d){ if (d[k] && d[k].n){ FAVS[d[k].n] = d[k]; cnt++; } }
    saveFavs(); renderPills(); render(true);
    toastMsg('已导入 '+cnt+' 条收藏');
  } catch(e){ alert('JSON 解析失败，请检查粘贴内容是否完整'); }
};

renderChips(); renderPills(); render(true);
</script>
