*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font:14px/1.65 -apple-system,"PingFang SC","Segoe UI","Microsoft YaHei",sans-serif;
  background:radial-gradient(1200px 500px at 80% -10%,rgba(99,102,241,.14),transparent 60%),var(--bg);
  color:var(--txt);min-height:100vh;padding-bottom:80px}
.wrap{max-width:1060px;margin:0 auto;padding:0 18px}
header{padding:34px 0 18px}
.kicker{font-size:12px;letter-spacing:.2em;color:var(--acc2);text-transform:uppercase;margin-bottom:6px}
h1{font-size:26px;font-weight:800;letter-spacing:.5px}
h1 .date{background:linear-gradient(90deg,var(--acc2),#c084fc);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--dim);font-size:13px;margin-top:6px}
.sub b{color:var(--txt)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{display:flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;

.chip .dot{width:8px;height:8px;border-radius:50%}
.chip b{color:var(--txt);font-weight:600}
.toolbar{position:sticky;top:0;z-index:50;padding:14px 0;

.toolbar-inner{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:220px;position:relative}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:.4}
.search input{width:100%;padding:11px 38px 11px 40px;border-radius:12px;border:1px solid var(--line);

.search input:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(99,102,241,.18)}
.search .clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);border:none;background:none;
  color:var(--faint);font-size:16px;cursor:pointer;display:none;padding:2px 6px}
.search input:not(:placeholder-shown) ~ .clear{display:block}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--panel);

.pill:hover{color:var(--txt);border-color:#3a4157}
.pill.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.pill small{opacity:.65;margin-left:3px}
.result-info{font-size:12px;color:var(--faint);margin:10px 2px 14px}
.result-info b{color:var(--acc2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;
  border-left:3px solid var(--cc,#3a4157);transition:transform .12s,border-color .12s;cursor:pointer;
  display:flex;flex-direction:column;gap:7px}
.card:hover{transform:translateY(-2px);border-color:#39415a;border-left-color:var(--cc)}
.card-top{display:flex;align-items:flex-start;gap:8px}
.card-name{flex:1;font-weight:650;font-size:14.5px;line-height:1.45;overflow:hidden;

.card-ver{font:600 11px/1 ui-monospace,Consolas,monospace;color:var(--acc2);background:rgba(99,102,241,.13);

.card-meta{font-size:11px;color:var(--faint);display:flex;justify-content:space-between}
.card-meta .tag{color:var(--cc);font-weight:600}
.card-desc{font-size:12.5px;color:var(--dim);white-space:pre-line;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card-desc:empty{display:none}
.card-open{font-size:10.5px;color:var(--faint);opacity:.75;display:flex;justify-content:space-between}

mark{background:rgba(250,204,21,.28);color:#fde68a;border-radius:3px;padding:0 1px}
.empty{display:none;text-align:center;padding:70px 20px;color:var(--faint)}
.empty .big{font-size:40px;margin-bottom:10px}
#top-btn{position:fixed;right:22px;bottom:22px;width:42px;height:42px;border-radius:12px;border:1px solid var(--line);

#top-btn:hover{color:#fff;border-color:var(--acc)}
footer{margin-top:40px;text-align:center;font-size:11.5px;color:var(--faint)}

.overlay{position:fixed;inset:0;background:rgba(4,6,12,.72);backdrop-filter:blur(4px);

.overlay.show{display:flex}
.modal{background:var(--panel2);border:1px solid #2c3145;border-radius:18px;max-width:580px;width:100%;

.m-close{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:10px;border:1px solid var(--line);

function renderPills(){

  p.innerHTML = '<div class="pill favpill'+(state.view==='favs'?' on':'')+'" data-view="favs">★ 我的收藏 <small>'+favCount()+'</small></div>'
    + '<div class="pill'+(state.view!=='favs'&&state.cat==='all'?' on':'')+'" data-cat="all">全部 <small>'+DATA.length+'</small></div>'

    if (el.dataset.view){ state.view = 'favs'; }

  });
}

function render(){
  const kw = state.kw.trim().toLowerCase();
  const src = state.view==='favs' ? Object.values(FAVS) : DATA;
  const list = src.filter(it =>
    (state.view==='favs' || state.cat==='all' || it.t===state.cat) &&
    (!kw || (it.n+' '+it.v+' '+it.d+' '+(it.ld||'')).toLowerCase().includes(kw)));
  grid.innerHTML = list.map(it => {
    const cc = catColor(it.t);
    const uid = 'u'+(++uidSeq); UID[uid] = it;
    const favd = !!FAVS[it.n];
    return '<div class="card'+(favd?' faved':'')+'" style="--cc:'+cc+'" data-uid="'+uid+'">'

      + '<button class="fav-btn'+(favd?' on':'')+'" data-fav-uid="'+uid+'" title="'+(favd?'取消收藏':'收藏')+'">★</button>'
      + '<span class="card-ver">v'+hi(it.v, kw)+'</span></div>'
      + '<div class="card-meta"><span><span class="tag">'+CAT_MAP[it.t]+'</span>'+(it.c?' · '+esc(it.c):'')+'</span>'+(fmtSize(it.s)?'<span>'+fmtSize(it.s)+'</span>':'')+'</div>'

    : '显示 <b>'+list.length+'</b> / '+DATA.length+' 个' + (kw ? ' · 关键词「'+esc(state.kw)+'」' : '');
}

  window[id] = d => fin(d);
  s.onerror = () => fin(null);
  setTimeout(() => fin(null), 9000);
  s.src = 'https://itunes.apple.com/search?term=' + encodeURIComponent(term) +
          '&entity=software&limit=10&country=' + country + '&callback=' + id;
  document.head.appendChild(s);
}
const norm = s => String(s||'').replace(/[^\w\u4e00-\u9fff]+/g,'').toLowerCase();
function rscore(term, cand){
  const t = norm(term), c = norm(cand);
  if (!t || !c) return 0;
  if (t === c) return 100;
  if (c.startsWith(t) || (t.includes(c) === false && c.includes(t) && t.length >= 2)) return Math.max(40, 85 - Math.abs(c.length-t.length)*2);
  if (c.length >= 2 && t.includes(c)) return Math.max(40, 75 - Math.abs(t.length-c.length)*2);
  const tw = t.split(/\s+/), cw = c.split(/\s+/);
  if (tw.length && cw.length){ const j = tw.filter(x=>cw.includes(x)).length / (tw.length+cw.length); if (j >= 0.4) return Math.floor(60 + j*20); }
  return 0;
}
function cleanName(n){
  let s = n.replace(/【[^】]*】/g,' ').split(/[-–—:：]/)[0];
  s = s.replace(/(多开|美化|纯净|官替|砸壳|破解|解锁|需授权|内购|免拨卡|去水印|修改器|汉化|辅助|国际服|国服|日服|韩服|台服|台湾服|越南服|整合包|第三方|开心版|端游移植|内置IGG|官方版|正式版)/g,' ');
  s = s.replace(/[（(][^）)]*[）)]/g,' ').replace(/\s+/g,' ').trim();
  return s || n.trim();
}

/* ── 详情弹窗 ── */
const overlay = document.getElementById('overlay');
const modal = document.getElementById('modal');
function closeDetail(){ overlay.classList.remove('show'); modal.innerHTML=''; curIt = null; }
let curIt = null;
function favBtnHtml(it){
  const f = FAVS[it.n];
  if (!f) return '<button class="m-fav not" id="m-fav">☆ 收藏这个应用</button>';
  if (f.v !== it.v) return '<button class="m-fav" id="m-fav">★ 已收藏 v'+esc(f.v)+' · 点此更新到 v'+esc(it.v)+'</button>';
  return '<button class="m-fav" id="m-fav">★ 已收藏 ✓（点击取消）</button>';
}
function syncModalFav(){
  if (!curIt) return;
  const old = document.getElementById('m-fav');
  if (old) old.outerHTML = favBtnHtml(curIt);
  const nb = document.getElementById('m-fav');
  if (nb) nb.onclick = modalFavAction;
}
function modalFavAction(){
  if (!curIt) return;
  const f = FAVS[curIt.n];
  if (!f){ toggleFav(curIt); }
  else if (f.v !== curIt.v){ FAVS[curIt.n] = snap(curIt); saveFavs(); toastMsg('收藏已更新 → v'+curIt.v); }
  else { toggleFav(curIt); }
  renderPills(); render(); syncModalFav();
}
overlay.addEventListener('click', e => { if (e.target === overlay) closeDetail(); });

function shotsHtml(m){
  var note;
  if (m.cc === 'Steam') {
    note = '截图来自 Steam 商店页《'+esc(m.nm)+'》（'+esc(m.ar||'')+'）· 端游移植版参考画面';
  } else if (m.cc === 'GitHub') {
    note = '截图来自开源仓库 '+esc(m.nm)+' 的 README · 点击卡片链接可查看源码';
  } else {
    note = '截图来自 App Store「'+esc(m.nm)+'」（'+esc(m.ar||'')+'）· '+esc(m.cc||'')+'区匹配 '+m.id+' · 破解版基于此原版修改';
  }
  return '<div class="shots">' + m.sh.slice(0,8).map(u => '<img loading="lazy" src="'+esc(u)+'" onerror="this.remove()" alt="截图">').join('') + '</div>'
    + '<div class="shots-note">'+note+'</div>';
}

function renderModal(it, idx){
  curIt = it;
  const cc = catColor(it.t);
  const sz = fmtSize(it.s);
  modal.innerHTML =
    '<div class="m-head">'
    + '<button class="m-close" id="mclose">✕</button>'
    + '<div class="m-title-row">'
    + '<div class="m-icon" id="m-icon" style="background:'+(it.col||'var(--acc)')+'">'+esc(it.n.trim()[0]||'?')+'</div>'
    + '<div class="m-titles"><div class="m-name">'+esc(it.n)+'</div>'
    + (it.sub ? '<div class="m-sub">'+esc(it.sub)+'</div>' : '')
    + '<div class="m-badges"><span class="badge v">v'+esc(it.v)+'</span>'
    + '<span class="badge cat" style="--cc:'+cc+';color:'+cc+'">'+CAT_MAP[it.t]+(it.c?' · '+esc(it.c):'')+'</span>'
    + (sz?'<span class="badge">'+sz+'</span>':'')
    + '<span class="badge">更新 '+esc('2026-11-18')+'</span>'
    + (it.lock==='1'?'<span class="badge" style="color:#fbbf24">需解锁</span>':'')
    + '</div></div></div></div>'
    + '<div class="m-body">'
    + (it.ld ? '<div class="m-sec"><h3>应用介绍</h3><div class="m-intro">'+esc(it.ld)+'</div></div>' : '')
    + (it.d ? '<div class="m-sec"><h3>破解 / 版本说明</h3><div class="m-hack">'+esc(it.d)+'</div></div>' : '')
    + '<div class="m-sec"><h3>官方截图（App Store 原版）</h3><div id="shots-box">'
    + (it.m ? shotsHtml(it.m) : '<div class="shot-loading"><span class="spin"></span>正在搜索原版应用截图…</div>')
    + '</div></div>'
    + '<div class="m-sec"><h3>相关链接</h3><div class="m-links" id="m-links">'+favBtnHtml(it)+'</div></div>'
    + '</div>';
  overlay.classList.add('show');
  document.getElementById('mclose').onclick = closeDetail;
  const favBtnEl = document.getElementById('m-fav');
  if (favBtnEl) favBtnEl.onclick = modalFavAction;
  const iconEl = document.getElementById('m-icon');
  const linksEl = document.getElementById('m-links');
  if (it.dl) {
    linksEl.innerHTML += '<a class="m-btn pri" target="_blank" rel="noopener" href="'+esc(it.dl)+'">⬇ 下载 IPA'+(it.lz==='1'?'（蓝奏云）':'')+'</a>';
  }
  if (it.m) {
    iconEl.innerHTML = '<img src="'+esc(it.m.art)+'" alt="">';
    var linkTxt = it.m.cc === 'Steam' ? 'Steam 商店页面' : (it.m.cc === 'GitHub' ? 'GitHub 开源仓库' : 'App Store 原版页面');
  linksEl.innerHTML += '<a class="m-btn" target="_blank" rel="noopener" href="'+esc(it.m.url)+'">'+linkTxt+'</a>';
  } else {
    linksEl.innerHTML += '<span class="m-empty-link">IPA 在源站内（需通过签名工具安装本源）</span>';
    // 运行时 JSONP 补救
    const term = cleanName(it.n);
    const box = document.getElementById('shots-box');
    const tryC = (country) => {
      itunesSearch(term, country, data => {
        const rs = data && data.results ? data.results : [];
        let pick = null, best = 55;
        for (const r of rs) {
          if (!r.screenshotUrls || !r.screenshotUrls.length) continue;
          const sc = rscore(term, r.trackName);
          if (sc > best) { best = sc; pick = r; }
        }
        if (pick) {
          const m = {sh: pick.screenshotUrls.slice(0,8), nm: pick.trackName, ar: pick.artistName, art: pick.artworkUrl512||pick.artworkUrl100, url: pick.trackViewUrl, cc: country, id: ''};
          box.innerHTML = shotsHtml(m);
          iconEl.innerHTML = '<img src="'+esc(m.art)+'" alt="">';
          var lt = m.cc === 'Steam' ? 'Steam 商店页面' : (m.cc === 'GitHub' ? 'GitHub 开源仓库' : 'App Store 原版页面');
          linksEl.innerHTML += '<a class="m-btn" target="_blank" rel="noopener" href="'+esc(m.url)+'">'+lt+'</a>';
        } else if (country === 'CN') { tryC('US'); }
        else if (country === 'US') { tryC('JP'); }
        else {
          box.innerHTML = '<div class="m-empty-link">未匹配到原版截图，<a target="_blank" rel="noopener" href="https://apps.apple.com/cn/search?term='+encodeURIComponent(term)+'">点此在 App Store 搜索「'+esc(term)+'」查看</a></div>';
        }
      });
    };
    tryC('CN');
  }
}

function openDetail(it){ if (it) renderModal(it); }

/* ── 导出 / 导入 ── */
document.getElementById('btn-export').onclick = () => {
  const n = favCount();
  if (!n){ toastMsg('还没有收藏，无内容可导出'); return; }
  const txt = JSON.stringify(FAVS);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([txt], {type:'application/json'}));
  a.download = 'goipa收藏备份_'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>toastMsg('已导出 '+n+' 条（文件+剪贴板）')).catch(()=>toastMsg('已导出 '+n+' 条（下载文件）'));
  } else toastMsg('已导出 '+n+' 条（下载文件）');
};
document.getElementById('btn-import').onclick = () => {
  const s = prompt('粘贴之前导出的收藏JSON（手机/电脑同步）：');
  if (!s) return;
  try {
    const d = JSON.parse(s.trim());
    let cnt = 0;
    for (const k in d){ if (d[k] && d[k].n){ FAVS[d[k].n] = d[k]; cnt++; } }
    saveFavs(); renderPills(); render();
    toastMsg('已导入 '+cnt+' 条收藏');
  } catch(e){ alert('JSON 解析失败，请检查粘贴内容是否完整'); }
};

renderChips(); renderPills(); render();
</script>
