ng","dt":"2026-11-23","srcs":["canmore"]},{"n":"APP","t":"1","c":"","v":"2.7.3","d":"软件来源：🟢\n✅一款iOS27系统免越狱砸壳软件","ld":"","sub":"","s":"55605985.28","dl":"","lz":"0","col":"","lock":"1","ico":"https://app.ioszc.com/uploads/20261121/b81c65f2c00840fb0eff555eda328b81.png","dt":"2026-11-23","srcs":["canmore"]},{"n":"Pillow - 睡眠助手","t":"1","c":"","v":"6.7.4","d":"软件来源：🟢\n✅解锁高级版，一款记录睡眠质量的App","ld":"","sub":"","s":"596901888","dl":"","lz":"0","col":"","lock":"1","ico":"https://app.ioszc.com/uploads/20231028/c98e01361eb04ad6d70dc617d87f4e37.png","dt":"2026-11-23","srcs":["canmore"],"m":{"id":0,"nm":"Lakr233/mobilePillowTalkLite","ar":"Lakr233","art":"https://raw.githubusercontent.com/Lakr233/mobilePillowTalkLite/main/Resource/Preview.png","sh":["https://raw.githubusercontent.com/Lakr233/mobilePillowTalkLite/main/Resource/Preview.png"],"url":"https://github.com/Lakr233/mobilePillowTalkLite","cc":"GitHub"}},{"n":"BCD","t":"1","c":"","v":"0.1.712","d":"软件来源：🟤\nWindows games on iPhone and iPad\n**BCD is in alpha:** an early stage of development, before beta. Many games run, many do not yet, and things can break between builds. When a game fails, please send a log.\n\n> **Everything new in this release is experimental and has been tried on only a few devices so far.** It may work great on yours, or it may not work at all. Either way, a log helps a lot.\n\n> **Tried a game on an earlier build? Reset its settings first.** On the game's page: **Options › Recommended settings › Reset to Recommended**. The recommended list changed for 78 games in this release.\n\nThis build brings everything since 0.1.686: X-Plane 12 getting further, frame generation and an FPS counter for Vulkan games, Valve's November 2026 Steam client for BCD Dock, an experimental Steam for Windows, new pages in Settings, a round of fixes from the logs you sent, and a fix for Epic games on an external drive.\n\n## X-Plane 12 (experimental)\n\nX-Plane 12 gets further than before. On one iPhone it loaded, drew its cockpit and flew for six minutes. It is slow, it has been tried on that one iPhone only, and it is still experimental.\n\n- **What you need:** iOS 26 or later and a device with a Metal 4 GPU. Start the game from your Steam library through BCD Dock, the way it was tried. On the game's page choose **Options › Recommended settings › Reset to Recommended**. The recommended settings carry everything below.\n- **Lowest graphics settings (new):** the recommended settings now carry `xplane-graphics = lowest`.\n  - **Why:** X-Plane saves its preferences only when it quits cleanly, and it never had. So every start took X-Plane's default settings and went straight into its first-time flight, with no main menu to lower them in. At those defaults the game stopped twice with \"X-Plane is totally out of memory\" and \"Failed to allocate a GPU buffer\", each time with BCD's address space full.\n  - **What it does:** before X-Plane starts, BCD sets the default of each of its 14 graphics settings, in X-Plane's own `Resources/settings.txt`, to the lowest value. X-Plane's safe mode and every other byte of the file stay as they were. What you save in X-Plane still wins over these defaults.\n  - **Going back:** X-Plane's own file is kept as `settings.txt.bcd-original` and put back when the line is removed.\n- **A 4 GB swap file (new):** the recommended settings now carry `swap-mb = 4096`, `swap-mode = 2` and `swap-min-mb = 1`. BCD then moves game data to a file on the device's storage when memory runs short. Without it iOS ended the app at its 8 GB limit while the flight loaded (5 GB at the menu, 8.1 GB three minutes later). With it the flight ran for six minutes at a peak of 6.8 GB, and X-Plane quit cleanly from its own menu.\n- **A freeze while loading:** one log showed the game compiling about 700 shader libraries over eight minutes. Then one more compile, a Metal library with no shader source, was still running 96 seconds later, and the game never drew again. BCD now refuses such a request at once instead of sending it to Metal's compiler. This was checked on a Mac. On the iPhone the next run took every shader from the cache, so the refusal itself has not been seen working there yet.\n- **FPS counter:** it never worked for X-Plane, because Vulkan games did not reach it. It does now (see below).\n- **What to expect:** about 13 to 18 FPS in flight at the lowest settings. The first start compiles shaders for several minutes (about 700 compiles over eight minutes in one log); later starts read them from the cache.\n- **With frame generation** (below) X-Plane reached about 35 FPS shown in flight on that iPhone, from about 15 of its own (the HUD's `15+15`). iPads and other iPhones have not been tried. If it fails on yours, please send a log.\n\n## Frame generation and the FPS counter for Vulkan games (experimental)\n\nVulkan games now get a working FPS counter and the frame-rate limit, on MoltenVK and on KosmicKrisp. Vulkan games that run on KosmicKrisp (the game's **Vulkan (experimental)** choice set to **KosmicKrisp**, which needs iOS 26 and a Metal 4 GPU) also get frame generation. X-Plane 12 on one iPhone is the only game and device all of this has run on so far: with frame generation it showed about 35 FPS in flight.\n\n- **Apple frame interpolation:** on the game's page, **Display › Apple frame interpolation**: one frame between two, or up to three. iOS's own video frame interpolation makes the extra pictures from two of the game's frames. It needs no help from the game. It needs iOS 26, and it works only on KosmicKrisp, not on MoltenVK.\n- **Lossless Scaling frame generation:** on the game's page, **Display › Lossless Scaling frame generation**: 2×, 3× or 4×.\n  - **Lossless Scaling is not part of BCD.** It is a program sold on Steam. You need your own copy: sign in to Steam in BCD, then **Settings › Graphics › Lossless Scaling › Check my purchase and download from Steam**, once. BCD asks Steam whether your account owns it, downloads it with your account, and keeps its file sealed on this device. The purchase is checked again every week.\n  - **For a Vulkan game,** BCD translates Lossless Scaling's frame generation shaders to Metal on the device when the game starts, from your own copy. The passes are then built in the background, which takes about 2 to 3 seconds. The translated file is removed when the session ends.\n  - With Lossless Scaling on, Apple frame interpolation stays off for that game: one generator at a time.\n- **Generated frames add a little delay.** They help most when the GPU has room to spare.\n- **The frame-rate limit now holds Vulkan games,** on MoltenVK and on KosmicKrisp, as it always held DirectX games. Before, a Vulkan game ran at the screen's own rate whatever the limit said: X-Plane's menu ran at 120 FPS with the limit at 60. **This changes every Vulkan game:** one that ran above its limit now runs at it. `env.MADEIRA_VK_FPS_CAP = 0` in a game's settings turns it off. For Vulkan games the limit holds the game's own frames, and the generated frames come on top.\n- **The FPS counter and the session summary now cover Vulkan games.** Before, every Vulkan game showed 0 FPS.\n- **The in-game HUD shows the frames frame generation made,** after the game's own rate: `15+15 FPS` is 15 frames of the game's and 15 that frame generation made.\n  - It counts Apple frame interpolation, Lossless Scaling and MetalFX frame generation, in DirectX games (through DXMT and BCD's Direct3D 12 bridge) and in Vulkan games on KosmicKrisp.\n  - The frame time, the lows and the graph stay the game's own. The colour judges every frame shown against the limit.\n  - Before, Lossless Scaling's frames in a Direct3D 11 game were counted as the game's own, so the rate was the sum of both.\n  - On a device, this was seen only in X-Plane 12 (Vulkan). The DirectX paths were checked by tests, not yet on a device.\n- **Not done:** Apple frame interpolation for Vulkan games on MoltenVK.\n\n## The November 2026 Steam client in BCD Dock, and why you don't need Steam for Windows to play (experimental)\n\n### What BCD Dock is\n- BCD Dock starts your Steam games through **Valve's own Steam client library** (`steamclient64.dll`, the file the full Steam app for Windows also uses). It runs inside BCD without Steam's window, its web browser (Chromium) and its library.\n- BCD Dock signs in with your own Steam sign-in. Valve's client then does what a game needs from Steam, as it does on a PC:\n  - the online sign-in and the check that you own the game;\n  - the game's Steam calls and any Steam DRM the game carries;\n  - the per-account programs some games need (BCD Dock asks the client to prepare them before the start);\n  - signing in offline;\n  - Friends in games, when you turn them on in **Settings › Accounts › Steam**.\n- BCD Dock is not a Steam emulator and bypasses nothing. Without Valve's sign-in and licence answer, a game does not start.\n\n### What the November 2026 client adds\n- **Settings › BCD Dock › Steam client** now offers three builds of Valve's client:\n  - **Jan 2026**, the default, unchanged;\n  - **Sep 2026**, unchanged: for games that ask for a newer Steam interface than January's has, such as Grim Dawn, Hades II and Enshrouded. No Friends;\n  - **Nov 2026**, new: the client Valve published on 13 November 2026.\n- **Newer Steam interfaces.** Nov 2026 has five interfaces that the January client lacks: `SteamUser024`, `SteamInput007`, `SteamNetworkingSockets013`, `SteamGameServer016` and `SteamMatchMakingServers003`. A game built with a newer Steam library can stop at its start with \"Missing interface adapter\", with \"No SteamUtils011\" or with a \"Steam is not running\" box. Nov 2026 has the newer interfaces such a game asks for. A game may still ask for something newer than Valve's client of 13 November has.\n- **Friends** work with Nov 2026, as with Jan 2026. Sep 2026 has none.\n- **BCD's suggestions** now name Nov 2026 when a game stops because its Steam library is newer than the client (for `SteamUtils011`, Sep 2026 has the interface too).\n- **Switching** moves your installed games, saves and settings to the chosen client, and you can switch back at any time. The old client's folder is renamed and kept. Nothing is deleted.\n- **A build BCD Dock does not know is refused before sign-in** with report code 30, not guessed at. BCD Dock checks the exact client file and the exact calls it makes into it, build by build. Valve moved four of the client's internal calls (the two ownership questions and the two offline sign-in calls) by one slot in this build, so each build now has its own table.\n- **Tried so far,** on one iPhone: the switch to Nov 2026 and back; games started through BCD Dock; a game whose per-account program Steam prepares; an offline start; Friends; a game that stopped on a missing Steam interface. The table for this build was made by reading Valve's file, without a device. These runs are its first tests.\n- **January 2026 stays the default.** Nov 2026 is less tested. Choose it when a game needs it. If a game no longer starts with it, switch back.\n\n### Why you don't need Steam for Windows to play\n- **The game already talks to Valve's real client.** Sign-in, ownership, Steam's calls, per-account programs, offline play and Friends all go through the same client library that BCD Dock runs. The full Steam app adds a window around that library. A game does not need the window.\n- **Memory.** Steam's window is a web browser. On the one iPhone tried it held 2.3 to 3.4 GB of the 8 GB iOS gives BCD, much of BCD's address space and a JIT pool of up to 1.1 GB for its own code. Heavy games need all of that for themselves. Through BCD Dock they get it.\n- **Each game's own BCD settings.** Through BCD Dock every game starts with its recommended settings and the ones you set on its page. A game started from Steam for Windows runs inside Steam's session, with that session's settings. X-Plane 12, started that way, found no Vulkan driver and quit after nine seconds.\n- **BCD's own library covers the rest:** downloads and updates, DLC you own, beta versions, Workshop items, Steam Cloud saves and Launch options.\n\n### When Steam for Windows can still help\nThese are things BCD itself does not do:\n- buying games or DLC in the Steam store;\n- Steam's own settings and account pages, and Steam's community pages;\n- your friends list and chat outside a game (BCD offers Friends in a game);\n- your achievements: BCD does not show them;\n- updating a game that Valve's client installed in its own library folder. BCD lists and starts such a game but does not update it.\n\nSteam's app on your phone, or Steam's website, can do most of these too.\n\n## Steam for Windows (experimental, off unless you turn it on): not for playing games\n\n> **Steam for Windows is not a way to play your games.** Play them through BCD Dock, as before. Turn this on only if you want to look around in Valve's own Steam app.\n\n- **What it is:** Valve's full Steam client for Windows, with its own window, store and library, in a Windows desktop inside BCD. Turn it on in **Settings › BCD Dock › Steam for Windows**, then install it there. BCD gets it from Valve's own servers and checks every file. You sign in in Steam's own window; BCD hands it no sign-in.\n- **What it is for:** the store, your library, Friends, the Workshop and Steam's own settings.\n- **Why not for games:** a game started from it runs inside Steam's own session. It does not get the settings BCD gives that game, and Steam's window uses much of the memory a game needs. Heavy games do not fit beside it. In tests on one iPhone it opened, signed in and showed the library, but the games tried from it did not run.\n- **It needs a lot of memory:** it is made for devices with a large address space and a memory limit of 6 GB or more, such as an 8 GB iPhone signed with the larger memory limit, or an M-series iPad. An update from Valve can break it.\n- **Games and DLC are shared both ways** (**Share games with BCD Dock**, on by default; it takes effect at the next start):\n  - **BCD Dock's games show as installed in Steam for Windows,** from the same files: one copy of each game, used by both. Steam may update or check them there. BCD keeps a one-time safety copy of BCD Dock's library records. This part was seen working on one iPhone.\n  - **A game you install in Steam for Windows shows in BCD's library** and starts through BCD Dock. BCD neither updates it nor changes its DLC.\n  - **Steam keeps BCD Dock's DLC choices.** Valve's client installs every DLC your account owns by itself, such as X-Plane 12's free scenery packs, while BCD installs only the DLC you chose. Before each session BCD tells Steam to leave off the DLC you did not choose. If BCD cannot look a game's DLC up (offline, or not signed in), Steam may still download them. At the end of the session, what you ticked, installed, unticked or removed in Steam goes into BCD's DLC choice.\n  - **Not yet tried on a device:** the DLC choices and the other direction of the sharing.\n- After a Steam for Windows session, restart BCD before you start a game through BCD Dock.\n\n## New in Settings\n\nNone of these has been tried on a device yet.\n\n- **Settings › Recommended settings (new page):** every game BCD has recommended settings for, in the list in use. Search by game name, program or Steam App ID, and filter by Steam, Epic, GOG or DRM-free. A game's page shows how it is matched, its switches, every line with whether your build has it, the lines only a device with less than 10 GB of RAM gets, and its notes. It only reads; nothing is changed from there.\n- **Settings › Memory & performance › In the background › CPU limit in the background:** 50% (the standard, unchanged), 65%, 80%, 100% or no limit. It sets how much of one core BCD uses while it keeps a game or a download going in the background. At 50% a big download is slow. iOS closes an app that averages above about 80% for a minute, so 100% and no limit can get BCD closed. It applies the next time you leave BCD.\n- **Bug reports carry your last game's log by default** (**Settings › Feedback › Attach my last game's log**).\n  - The row names the log: the game, the day and the size. Turn it off and BCD keeps that choice.\n  - The log is cleaned on the device before it goes: user names, e-mail addresses, IP addresses and account IDs are taken out.\n  - An idea or another message still carries a log only when you turn it on.\n- **End the game now:** a game that ignores **Close** used to leave you only the way of closing BCD. After 45 seconds the session's top line says so, and the in-game menu offers **End the game now**. Unsaved progress is lost. Not offered on the Windows desktop or while a game is still starting. A new session also no longer counts a process that an earlier session left running.\n- **Frame cap: 20 and 25 FPS** (**Settings › Graphics › Frame cap**, now 20, 24, 25, 30, 40 and 60). Frame generation doubles them to 40 and 50. The cap now also holds Vulkan games, which it did not before, and the HUD judges its colour against it.\n\n## Programs built on Qt 6 (experimental)\n\nQt 6 programs need Windows' ICU libraries (`icuuc.dll` and `icuin.dll`), which Wine does not have. Such a program ended at once with a missing-library error (c0000135): Bloodborne's PC port launcher, Anki, the Albion launcher. BCD now carries ICU 78.3 (Unicode 17.0), trimmed to what Qt needs, and gives it to a program that asks for it. Bloodborne's launcher has the line in its recommended settings. Auto-tune adds it for another Qt 6 program that stops this way; an older build is told to update. ICU's licence is in the app's notices. Not yet tried on a device.\n\n## Fixed in games (from the logs you sent)\n\nEach was made from a log and checked by tests on a Mac. None has been tried on a device yet.\n\n- **Half-Life 2** stopped within seconds of starting, every time. BCD took the game's first write next to a protected page of its own for a write to the protected page. With `env.MADEIRA_GUARD_NEIGHBOUR_PASS = 1`, in its recommended settings, such a write goes through.\n- **The Binding of Isaac** crashed on a memory block that BCD placed outside the part of the address space a 32-bit game can reach. A 32-bit game's memory now stays inside its own part, or the request is refused (`env.MADEIRA_WOW_ALLOC_INSIDE = 1`, in its recommended settings).\n- **S.T.A.L.K.E.R. Clear Sky and Call of Pripyat** stopped at a shader whose loop BCD's shader compiler cannot write for Shader Model 3. With `env.MADEIRA_HLSL_LOOP_FALLBACK = 40` the loop is written as up to 40 repeated steps. Their recommended settings carry it.\n- **DOOM 3: BFG Edition** crashed in BCD's OpenGL when it asked about an empty sync object (`glIsSync(0)`). That now answers as OpenGL defines it, for every game on BCD's OpenGL.\n- **METAL GEAR SOLID V** stopped at \"Failed to load SteamAPI\". It checks the signature of `steam_api64.dll`, and the chain ends in a root certificate BCD's web list lacks (VeriSign Class 3 Public Primary Certification Authority - G5). With `env.MADEIRA_CODESIGN_ROOTS = 1`, in its recommended settings, that one root, pinned by its SHA-256, counts for code signatures. Nothing is added to the root store, so web connections never use it.\n- **Buckshot Roulette** needs `--rendering-driver opengl3` to find a graphics driver. BCD cut a program name at its first blank, so the line for \"Buckshot Roulette.exe\" never matched. Names with a blank now work in `env.MADEIRA_CHILD_ARGS`, and the game's recommended settings pass the argument.\n- **A game that froze for good after a click on its window's frame** (title bar and edges of a windowed game) no longer does. The size and move loop of such a window now takes taps and keys. `env.MADEIRA_GAME_INPUT_WAKE = 0` turns it off.\n- **EA games started through Steam** (Battlefield 4, Mass Effect: Andromeda, Need for Speed, STAR WARS Jedi: Fallen Order, The Sims 4, Unravel and others) go through EA's launcher, whose background service needs Windows' service manager. BCD Dock now starts Wine's service manager for a game whose install script runs EA's installer. These games, and FIFA 22 and Need for Speed: Most Wanted (2012), also get the Wine libraries the EA app asks for in their recommended settings.\n- **A 64-bit game's big program or library that did not fit the room left in BCD's code memory** was copied anyway, the copy was refused, and the game never started (Cyberpunk 2077's XeSS libraries and others). Such a file now runs from its own file instead.\n- **Cyberpunk 2077:** its recommended settings now keep its images out of the code memory and handle its 16, 64 and 32 GB address reservations, and also match its launcher program. Auto-tune has a rule for its overlapping reservations.\n- **Spider-Man:** Marvel's Spider-Man Remastered and Miles Morales get the swap file from the first start on devices with less than 10 GB of RAM. Spider-Man 2 gets the per-process keyed event setting.\n- **More:** Dark Souls: Remastered is told it has 8 GB, so its minimum-memory box does not stop it. NARUTO: Ultimate Ninja STORM and The Elder Scrolls IV: Oblivion get a DirectInput view of the controller. TEKKEN 7 and Little Nightmares get Wine's Windows Error Reporting library. eFootball PES 2021 gets Wine's DirectX diagnostics library. Detroit: Become Human gets Vulkan on KosmicKrisp. ULTIMATE MARVEL VS. CAPCOM 3 gets BCD's 64-bit Direct3D 9. FINAL FANTASY TACTICS gets new Direct3D 12 settings. Rows now also name a game's program, so a copy outside Steam gets them too (see the list below).\n\n## Resident Evil 4 (2005) and other Direct3D 9 games: copying only what a draw reads (experimental)\n\nA player's log showed Resident Evil 4 (2005) running at 60 FPS for 30 seconds and then at 4 to 6 FPS. The game locks its dynamic vertex buffers about 210 times a frame, 1 to 256 bytes each, and every draw after a lock copied the whole 3.8 MB buffer to the GPU: 788 MB a frame in the log. The GPU was 5 to 8% busy.\n\n- **New, off unless set:** `env.DXMT_D9_VB_RANGE = 1`. A draw that is not indexed then copies only the vertex bytes it reads. Indexed and instanced draws, draws from the game's own memory and any stream whose layout is doubtful keep the whole copy. With the line off, nothing changes.\n- **It is on, through their recommended settings (from build 710), for Resident Evil 4 (2005) and for every game whose logs showed the same copy** (10 MB or more a frame): Vampire: The Masquerade - Bloodlines, Alan Wake, Blur, Ultra Street Fighter IV, Mount & Blade: Warband, Team Fortress 2, Garry's Mod, Left 4 Dead 2, Counter-Strike: Source, Half-Life 2, Half-Life 2: Deathmatch, No More Room in Hell, Call of Duty: World at War, Call of Duty: Black Ops, Call of Duty: Modern Warfare 3, Grand Theft Auto IV, The Elder Scrolls V: Skyrim (2011), Splinter Cell: Double Agent and Burnout Paradise. Games that draw mostly with indexed draws (the Source engine games, for example) may gain little. The log says `[vb-range] madeira-bcd on`.\n- **Not yet tried on a device.** If you play one of these games, please send a log.\n\n## From pull requests\n\nThank you to the people who sent these.\n\n- **Touch-control editor: select several controls at once.** Drag from an empty spot in the editor to select several buttons or sticks, then move them together, or resize them together with a pinch or the Size slider. Guides appear while you move a control near another one's edge or centre, and it snaps into line. (pull request #69)\n- **Teardown: the missing half of the scene.** The game draws much of its world with Direct3D 12 indirect draws that carry several arguments per draw, and BCD skipped them. With `indirect-expand = 1` BCD now draws them from the game's own records. It is off by default, because a game that changes those records after recording would draw stale ones. Teardown's recommended settings turn it on. Tried on one device by the pull request's author. (pull request #67)\n- **Auto-tune judges two kinds of sessions correctly** (pull request #64):\n  - a line BCD writes about the previous run is no longer read as this session's, so a game that closed after a few seconds is no longer scored as if it had played for minutes;\n  - Windows' shortcut helper (`winemenubuilder.exe`), which Wine tries to start and BCD does not ship, no longer makes a session that played look like a crash.\n- **A rare crash when a thread ends** (pull request #64), behind a setting that is off by default (`env.MADEIRA_EXIT_POOL_SKIP = 1`). It now also clears the places where the system keeps the first objects of a thread's memory pool. BCD's own tests now pass on the build Mac.\n\n## Auto-tune\n\n27 rules are new and 14 changed. Each has a log it was made from.\n\n- **Steam client stops** now point to **Nov 2026** (see above).\n- **New fixes it can try:**\n  - a game that checks the memory it is told and refuses to start gets 8 GB told;\n  - a game started through EA's Steam launcher gets Windows' service manager;\n  - a game that stops with \"needs Vulkan\" gets Vulkan on KosmicKrisp turned on;\n  - a game's .NET runtime that reserved 256 GB of address space gets a 16 GB range;\n  - a Java game that stopped right after its first garbage collection gets the simple collector or plain code memory (Project Zomboid, Slay the Spire);\n  - an OpenGL game that stopped at a `ChoosePixelFormat` error or at SDL3's \"OpenGL 3.2 is required\" box gets BCD's own OpenGL driver turned on (Old School RuneScape, Underkeep);\n  - a program built on Chromium whose 16 GB request found no room gets a smaller block (Slow Roads);\n  - a 32-bit game that plays but spends most of its frame time on slow memory writes gets ordinary memory, kept only if it then plays without the slowdown.\n- **Answers that say what to do:**\n  - a game started as a program file that asks for Steam (\"Steam is not running\"): start it from your Steam library through BCD Dock;\n  - an EA game that starts itself through EA's Origin launcher: start it with Steam instead;\n  - a device where iOS gives BCD only 4 GB: too small for the game. Lower its own texture and shadow settings.\n- **It can add a DLL to a game's own list of DLLs.** Until now a rule that wanted one more DLL was skipped when the recommended settings already had a list. It now adds its names after the list's, and never drops one.\n- **More starts count as failures,** so a fix is offered after them: a BCD Dock game that showed an error box and drew no frame, a game that closed by itself before its first picture, and a start where the JIT pool was refused. A replay of 6,303 earlier logs changes 24 verdicts, each a failure that had been missed.\n- **Several rules were narrowed** so they stop matching games they did not help (the Chromium address-space rule matched 325 earlier logs, and only 65 were the real case).\n\n## Recommended settings\n\nThe list went from 88 to 96: 43 games are new and 35 changed. Some of the updated games only gained a program name, so a copy outside Steam gets their settings too.\n\n- **New:**\n  - EA games started through Steam: Battlefield 4, Mass Effect: Andromeda, Mass Effect Legendary Edition, Need for Speed (2015), Need for Speed Heat, STAR WARS Jedi: Fallen Order, The Sims 4, Unravel.\n  - Action and adventure: Detroit: Become Human, Metro Exodus Enhanced Edition, Bright Memory: Infinite, Resident Evil 4, Resident Evil 4 (2005), Shadow of the Tomb Raider, Little Nightmares, Batman: Arkham Asylum GOTY (Epic Games copy), Half-Life 2, Bloodborne (PC port launcher), DragonSword: Awakening.\n  - Fighting and sports: ULTIMATE MARVEL VS. CAPCOM 3, NARUTO: Ultimate Ninja STORM, eFootball PES 2021, Ultra Street Fighter IV.\n  - With the Direct3D 9 vertex change only: Alan Wake, Blur, Mount & Blade: Warband, Team Fortress 2, Garry's Mod, Left 4 Dead 2, Half-Life 2: Deathmatch, Call of Duty: Modern Warfare 3 (2011), The Elder Scrolls V: Skyrim (2011), Splinter Cell: Double Agent.\n  - Other: Teardown (from a pull request), VRChat, Don't Starve, Echo Weaver, Cryptid Park, Old School RuneScape, Slow Roads, Underkeep, We Steal From Old People: The Game, Fields of Mistria.\n- **Updated:**\n  - X-Plane 12 and Red Dead Redemption 2 (not Steam: its Launcher.exe beside RDR2.exe).\n  - Big releases: Marvel's Spider-Man Remastered, Marvel's Spider-Man: Miles Morales, Marvel's Spider-Man 2, Cyberpunk 2077, Clair Obscur: Expedition 33, HITMAN World of Assassination, FINAL FANTASY TACTICS - The Ivalice Chronicles, METAL GEAR SOLID V: THE PHANTOM PAIN, DARK SOULS III, Dark Souls: Remastered, Rise of the Tomb Raider, TEKKEN 7, Dead Space (2023).\n  - EA, Need for Speed and FIFA: Need for Speed: Most Wanted (2012), Need for Speed: Most Wanted (speed.exe), FIFA 22.\n  - The Direct3D 9 vertex change also went into Vampire: The Masquerade - Bloodlines, Call of Duty: Black Ops, Grand Theft Auto IV, Counter-Strike: Source, Call of Duty: World at War, Half-Life 2, No More Room in Hell and Burnout Paradise.\n  - Others: Unrailed! 2: Back on Track, Batman: Arkham City GOTY, Requiem: Avenging Angel, S.T.A.L.K.E.R. (X-Ray engine games), Saints Row: The Third, Sleeping Dogs: Definitive Edition, Call of Duty: Black Ops, The Binding of Isaac: Rebirth, Buckshot Roulette, The Elder Scrolls IV: Oblivion, THE KING OF FIGHTERS XIV, Day of the Tentacle Remastered.\n\n## Fixed: Epic games on an external drive\n\n- **Installs on some external drives were refused for space** although the drive had plenty of room. In one log the drive answered 0 free to the question BCD asked, and every Epic install was refused at once. BCD now reads the drive's free space the way its Steam downloads already do. A tester confirmed it.\n- **On a drive BCD asks only for the room the game's files still lack.** exFAT has no sparse files, so a file created at its final size already holds its room.\n- **A refused install writes the space it needed and the space it found into the log.**\n\n## Known issues\n\n- **X-Plane 12** is slow (about 13 to 18 FPS of its own in flight at the lowest settings, about 35 shown with frame generation) and has been tried on one iPhone only. Its first start compiles shaders for several minutes.\n- **Apple frame interpolation** does not work for Vulkan games on MoltenVK yet.\n- **Vulkan frame generation:** the frame-rate limit holds the game's own frames; the generated frames come on top of it.\n\nInstall help, game reports and ideas: the BCD-Games Discord is open, https://discord.gg/43TmupTVug","ld":"","sub":"","s":"219.8 MB","dl":"","lz":"0","col":"#F070F0","lock":"1","ico":"https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/BCD/icon.png","dt":"2026-11-23","srcs":["canmore"]},{"n":"VeneraNext","t":"1","c":"","v":"1.18.4","d":"软件来源：🟤\n跨平台漫画阅读器\n### 正式发布与验收\n\n- 发布 `1.18.4+253`，汇总 RC1–RC3 和后续反馈修复。Android 手机／TV、Windows、macOS、iOS、Linux x64／ARM64 从同一正式标签重新构建，公开并核验后推进稳定更新渠道、AltStore 和 Winget 元数据。\n- 鸿蒙改为独立 Actions Beta 分发，继续从准确主线提交构建 ARM64／API 26 未签名 HAP，提供来源 manifest、校验值和独立设备验收模板；本次正式 Release 不附带 HAP，也不声明鸿蒙真机验收通过。历史 RC、正式版及其鸿蒙附件保持原样。\n- #178 的 Android 120 Hz 连续翻页和 #188 的收藏目录切换已获提出者明确确认；#129、#152 已交付可安装修复且超过 72 小时未收到新的失败反馈，按约定接受，不将超时视为真机确认。\n- #166 的强 Cloudflare／TLS 兼容问题及 #186 原设备更新检查网络故障因缺少充分证据暂缓，相关异常处理与诊断改进不代表原始问题已修复。白边裁剪仍会保留带扫描痕迹、压缩灰点或靠边内容的区域；#159 长期外部目录及 #163、#81、#123 等增强继续后续安排。\n- 升级前导出并另存完整应用数据备份、保留原漫画文件；沿用原包名与签名身份覆盖安装，无需清库或重新导入。鸿蒙独立 Beta 仍需用户沿用原密钥自行签装。\n\n### 候选版已交付的功能与修复\n\n- 阅读器提供「锁定阅读菜单」和靠边小锁，锁定期间阻止触摸／右键唤出菜单，保留翻页、滚动、缩放，跨章与旋转保持锁定；TV 确定键先解锁，再次操作打开菜单。纵向连续／瀑布流支持默认关闭的「裁剪左右白边」，后台逐页检测、保留内容和双页中线，原图、下载、保存及导出不变（#139）。\n- 收藏支持从零开始多选、全选／反选、长按范围选择及当前父目录的子目录排序；宽屏常用操作直接显示在顶栏，桌面 Esc 按弹窗、多选、搜索顺序退出。详情收藏面板使用完整可用高度，新建文件夹固定在顶栏，长目录名和大字号布局不再溢出（#152、#155、#157、#158）。\n- 关键词屏蔽提供字面文字包含、独立词、标签完全匹配及逐规则大小写设置，支持编辑、示例试匹配、命中原因和原文高亮；短英文缩写推荐独立词，规则保存、旧数据与备份兼容保留（#115）。\n- Cloudflare 页面检查就绪状态及返回类型，合并并发检查并等待有效 Cookie／User-Agent 持久保存后结束，关闭页面后取消迟到结果（#165）；强验证站点的 TLS／Bot 兼容范围仍受上述限制。\n- 设置保存期间保持控件布局，慢保存才显示进度；阅读器调光预览、底栏和保存状态同步监听实时设置，修复面板跳动及当前页保存后亮度回退，保留失败重试与连续操作（#168、#169、#180）。\n- 收藏按实际输入缓存搜索、规则及历史筛选，图片使用紧凑字节缓冲并合并进度刷新；连续／瀑布流异步尺寸变化保留阅读位置，前章插入等待滚动空闲，减少加载与阅读期间重复工作（#167、#170、#178）。\n- 鸿蒙独立 Beta 延续批量归档和合集 ZIP 导入、完整备份及恢复，统一所有语言的 `VeneraNext` 桌面名称；未实现的长期外部存储、平台应用锁及系统分享入口继续显示准确限制（#159、#162）。\n- 完成测试职责与公共夹具整理，删除已废弃模板及冗余用例；CI 保留实际加载／用例／跳过记录、完整分片与覆盖率、原生所有权和内存检查，以及 Android／TV、Windows、Apple 和真实文档 Provider 验证。\n\n### 安全与依赖\n\n- 更新 QUIC 和证书信任等锁定 Rust 依赖，保留完整 RustSec 扫描与原生平台兼容检查。\n- 将 Rhttp 的 `url` 锁定版本从 2.5.7 更新至 2.5.9，修复嵌套 `blob:` URL 的来源解析可能触发栈溢出的问题（RUSTSEC-2026-0592）；同步采用其要求的 `form_urlencoded` 1.2.3，保留现有 Rust／桥接版本和 iOS 兼容固定值，继续执行完整依赖审查与云端原生构建。\n\n### 本地漫画导入修复\n\n- 解压后的漫画目录复制改为直接检查暂存文件，避免每复制一张图片都重新枚举不断增长的输出目录。待复制页在实际读取时按源清单校验，已复制页仍提前核对源文件，减少首次导入对全部图片的重复读取；保留源目录结构检查、逐文件内容校验、完成证明和中断恢复。\n- 目录及漫画合集导入显示读取、检查、复制和完成校验的文件计数与进度，实际进入登记阶段后才提示保存到漫画库；加载提示保留首帧显示前收到的进度更新。\n\n### 阅读器修复\n\n- 分页布局与状态校验只读取所需设置，并复用同次布局结果，减少连翻时整份设置的重复解析；保留漫画、设备和全局设置优先级、TV 单图限制及过期请求检查。标题栏、底栏操作与亮度控件按输入复用，页码和跳页能力继续更新，实时调光、语言、主题、文字缩放及会话变更仍刷新对应控件（#178）。\n- 图片收藏状态仅缓存当前章节的页码集合，缓存命中仍经过原数据库访问队列；写入、导入、清空和连接变化后失效，查询失败可重试，减少隐藏菜单随连翻重复查询和解析收藏记录（#178）。\n- 分页预加载从页面构建移到翻页意图产生后的帧末合并调度，优先准备已接受的目标页及方向邻页；保留当前／目标页已开始的订阅，限制为两路并行解码和四个准入任务，取消后的原生清理完成前继续占用名额。预解码成功时请求清理所需的帧，空闲画面下也能释放名额并继续队列（#178）。\n- 选页使用活动页通知更新缩放状态，同章节翻页只刷新阅读器外壳及输入有效性，减少整个 Gallery 和阅读内容重建；同页回报不再重复保存进度，分别验证分页通知与视口交接的刷新次数，保留动画交接、章节边界、常亮、墨水屏与退出清理（#178）。\n- 主页导入漫画直接进入根阅读器，避免先创建带封面转场的详情页再立即替换；恢复进度使用当前窗口的历史库。历史、本地、追更、稍后阅读及网格封面使用独立且稳定的转场标识，避免同一本漫画在主页不同区域出现重复标识并留下封面占位（#129）。\n- 连续快速翻页在已有动画尚未完成时直接交接到目标页，避免音量键重复输入不断重启动画；保留旧动画完成的代次校验，墨水屏刷新按视口实际选中的页触发，覆盖正反向、横竖方向和单双页（#178）。\n- 连续与瀑布流恢复进度时保留尚未解码目标页的布局锚点，空闲状态下不按占位图尺寸改写页码，避免邻页先解码时将第 2 页推进到第 3 页；手动滚动与直接跳页仍可切换位置（#178）。\n- 合并重复的旧替代动画回归，在现有控制器交接测试中校验直接跳页、后续动画与迟到完成隔离；其余显式直跳、重置和异常路径的回归继续保留（#178）。\n- 图片收藏状态查询完成时只刷新可见的阅读菜单，隐藏菜单仍保留快捷收藏与失效后的重新查询，并暂停隐藏控件的动画，避免加载指示器持续产帧；同一帧的视口卸载／挂载通知合并发布，仅在最终视口所有者变化时更新菜单，减少阅读期间重复构建（#178）。\n- 阅读器及元数据加载入口铺满不透明的阅读背景，保留首帧、加载、错误重试和内容展示时的背景；阅读器控件在自身 Overlay 内获得 Material，避免依赖上级页面的背景与控件容器（#172）。\n\n### 收藏交互修复\n\n- 保存选中目录时保持收藏侧栏与内容区域的布局，正常写入不再插入临时进度行，避免切换目录时整个收藏区域上下跳动；保存失败仍显示重试，快速切换保留最终选择，退出仍等待已接受的保存（#188）。\n- 大规则集按大小写策略分组执行字面量预检查，精确标签及冒号后首段按索引匹配，减少首次进入或重新读取大收藏列表时逐本、逐规则重复扫描；命中后仍按原规则顺序、字段顺序和 Unicode 边界确定原因与原文位置。小规则集及首条规则的文本命中继续直接匹配，保留现有屏蔽范围（#167）。\n- 收藏搜索输入由页面保存，退出多选后保留检索词及对应结果，修复 Esc、关闭按钮或取消选择后输入框为空而列表仍在筛选的问题；退出搜索或切换目录时统一清空查询，返回输入框后可继续编辑，保留弹窗优先关闭的 Esc 顺序（#152）。\n- 收藏页与网格共用一份关键词屏蔽结果，按漫画快照缓存命中状态，搜索输入、退出搜索和阅读状态切换复用已匹配的漫画；规则或影响描述的显示设置变化时失效，保留屏蔽范围、隐藏数量、原因查看和可见项多选语义（#167）。\n- 阅读状态批量查询改在独立只读连接中执行，与历史写入共用数据访问顺序及关闭保护；按漫画 ID 与来源类型匹配，切换筛选复用完成状态，切换文件夹、历史库或连接后丢弃旧结果。等待和失败可见，查询失败可重试，页面构建不再同步查询整批历史（#167）。\n- 收藏页同时检查自身及外层导航路由，被详情或根阅读器覆盖时合并收藏通知，并延后异步列表与筛选结果的应用，返回后统一刷新。屏蔽规则后台变更只使缓存失效；保留明确的文件夹切换、已接受操作和后来选择的有效性检查（#167）。\n- 收藏页搜索、多选与普通模式保持相同页面结构，按列表、文件夹及选择的实际变化复用网格，避免键盘变化或空查询开关重建可见卡片；保留多次切换后的 Esc 退出与点击偏好菜单刷新。网格被详情或阅读器遮住时延后徽标查询，返回后读取最新进度，减少后台卡片构建（#167）。\n- 阅读状态筛选结果在进入／退出搜索时复用，搜索期间的历史变更仍使正常列表失效；收藏页被详情页遮住时延后整批进度筛选，返回后按最新进度刷新，减少后续阅读页面承担的后台查询（#167）。\n- 没有漫画屏蔽规则时跳过整批漫画元数据匹配，可见收藏直接复用列表；多选工具栏在打开具体操作时才复制漫画数据，仍在排队写入之前保留独立快照，减少进入收藏和多选时的同步工作（#167）。\n\n### 应用更新修复\n\n- 更新检查记录实际请求地址、原始异常、HTTP 状态及 GitHub 限流信息，避免日志只保留笼统的失败描述；手动检查区分连接、超时、限流和无效更新信息，并允许失败后重试（#186）。\n- 更新请求等待超过 30 秒时取消实际 HTTP 操作，并等待原生资源释放后结束；页面关闭和用户取消仍安静退出，保留稳定／预发布渠道及 TV、鸿蒙安装包筛选。\n\n### 开发维护\n\n- 发布与原包恢复流程按原提交中的鸿蒙分发配置选择必需任务；独立 Beta 模式禁止 HAP／设备报告进入普通正式版，普通平台仍须完整成功并逐包核对名称、大小与 SHA-256。历史随版 HAP 的源码、资产和真机报告门禁继续保留，新增分发及失败路径回归。\n- 阅读诊断升级至 schema 3，记录完整保留的逐帧 VSync／构建时间、音量键、动画交接、实际选页及四分之一页位置样本，同时记录缓存上限与占用；默认关闭并限制缓冲大小，旧动画完成不会写入新采集。复制预览保留 60,000 字符限制并分别统计省略的图片、帧及翻页样本，新增主动保存完整 JSON 报告，方便原 Android 120 Hz 设备对照连翻节奏（#178）。\n- PNG／JPEG 混合预缓存后的逐页裁剪回归改用最新窗口接口，补齐有界队列中的后续图片；测试退出同时取消并等待预缓存与图片工作，持续推进清理所需的帧，避免断言失败后卡住后续用例（#178）。\n- 用 #139 提供的两张原始 JPEG 复查白边检测，确认外侧扫描痕迹会阻止该侧裁剪，白边内的压缩灰点会提前限制范围。现有逐页入场回归加入 PNG／JPEG 混合预缓存，补齐深浅灰像素保护；更新中英文指南中的裁剪限制并移除过期的未发布标记，检测阈值与原图保持不变。\n- 漫画源事务中断探针通过标准输出管道发送 PID 和阶段信号，避免 Windows 在读取就绪文件时遇到跨进程占用；保留真实终止、活动所有者拒绝恢复和全部持久化恢复断言。\n- 清理已完成的测试整理、Issue 快照、依赖审计、历史操作与平台实验记录，将当前规则、依赖例外、鸿蒙长期目录条件和排障方法合并进现有指南；原始资料保留在 `v1.18.4-rc.3` 标签和 Git 历史中。\n- 精简发布准备与阅读诊断文档，更新文档索引、审计引用及中英文指南，修正漫画源、PDF 后台导入和收藏交互仍标为未发布的过期说明。\n- 退役已经由导入事务日志替代的旧目录替换工具及五项专属测试，更新架构基线，保留现行事务、真实中断恢复与历史漫画格式兼容回归。\n- 移除固定 QuickJS 已包含的重复数值缓冲实验补丁和 iOS 默认启动图模板说明，保留现行诊断探针、平台资源、许可证及构建输入。\n\n鸿蒙继续通过独立 Actions 工作流提供未签名 Beta 测试包：[HarmonyOS Beta](https://github.com/CyrilPeng/Venera-Next/actions/workflows/harmonyos-release.yml)。本次正式版不包含 HAP，鸿蒙设备验收仍待完成。","ld":"","sub":"","s":"20.6 MB","dl":"","lz":"0","col":"#2090E0","lock":"1","ico":"https://raw.githubusercontent.com/bebound/AltGallery/refs/heads/master/apps/Venera-Next/icon.png","dt":"2026-11-23","srcs":["canmore"],"m":{"id":6449987166,"nm":"Android Switch","ar":"Google","art":"https://is1-ssl.mzstatic.com/image/thumb/Purple211/v4/ad/68/56/ad685653-963c-457f-c8f4-ad09f6d02b04/logo_android_switch_color-0-0-1x_U007emarketing-0-0-0-7-0-0-0-85-220.png/512x512bb.jpg","sh":["https://is1-ssl.mzstatic.com/image/thumb/PurpleSource116/v4/8a/06/cf/8a06cfd7-a4de-c822-40d7-ec6a99ac2f95/114dc5d0-2a2f-495d-928b-7c9bb03a434f_iOS-5.5-in_0.png/392x696bb.png","https://is1-ssl.mzstatic.com/image/thumb/PurpleSource126/v4/12/2c/b1/122cb198-bb07-46ae-8d75-e29e628de7b1/bb8aa28c-9ded-4dbd-aadf-7a4a2dac0ca4_iOS-5.5-in_1.png/392x696bb.png","https://is1-ssl.mzstatic.com/image/thumb/PurpleSource116/v4/fc/86/4e/fc864e3c-9fbb-93b1-79dc-7505949dc6d9/a51cfa48-b82f-48d2-9ebf-55d3df4ba576_iOS-5.5-in_2.png/392x696bb.png","https://is1-ssl.mzstatic.com/image/thumb/PurpleSource126/v4/75/9f/11/759f11eb-0ded-cb71-309c-1b0fc3b2fca4/f1c3f483-c825-4d25-9c69-14e1bc84a211_iOS-5.5-in_3.png/392x696bb.png"],"url":"https://apps.apple.com/us/app/android-switch/id6449987166?uo=4","cc":"US"}},{"n":"MoviePilot","t":"1","c":"","v":"2.0.2","d":"软件来源：🟤\nMoviePilot 的 iOS 原生客户端\nMoviePilot iOS 2.0.2 全面适配 **iPad**（竖屏、横屏、分屏与原生侧边栏工作台）与 **iPhone Duo**（系统竖向侧边操作区），带来跨设备形态一致且充分利用大屏与侧边交互区的原生体验。\n\n### 2.0.2 新增与优化\n\n- **iPhone Duo 系统竖向侧边操作区全面适配**：彻底移除传统底部导航栏样式，将「发现 / 探索 / 我的 / 设置 / 更多功能 / 智能助手」与动态主动作/全局搜索原生承载至 iPhone Duo 系统竖向侧边操作区（`axisBehavior(.verticalPreferred)`）；子页面自动保留返回、页面工具与更多入口，全屏视频播放按系统建议自动关闭竖向 let jpSeq = 0;
function itunesSearch(term, country, cb){
  const id = '_itcb' + (++jpSeq);
  const s = document.createElement('script');
  let done = false;
  const fin = (data) => { if(done) return; done = true; try{ delete window[id]; }catch(e){} s.remove(); cb(data); };
  window[id] = d => fin(d);
  s.onerror = () => fin(null);
  setTimeout(() => fin(null), 9000);
  s.src = 'https://itunes.apple.com/search?term=' + encodeURIComponent(term) +
          '&entity=software&limit=10&country=' + country + '&callback=' + id;
  document.head.appendChild(s);
}
const norm = s => String(s||'').replace(/[^\w\u4e00-\u9fff]+/g,'').toLowerCase();
function rscore(term, cand){
  const t = norm(term), c = norm(cand);
  if (!t || !c) return 0;
  if (t === c) return 100;
  if (c.startsWith(t) || (t.includes(c) === false && c.includes(t) && t.length >= 2)) return Math.max(40, 85 - Math.abs(c.length-t.length)*2);
  if (c.length >= 2 && t.includes(c)) return Math.max(40, 75 - Math.abs(t.length-c.length)*2);
  const tw = t.split(/\s+/), cw = c.split(/\s+/);
  if (tw.length && cw.length){ const j = tw.filter(x=>cw.includes(x)).length / (tw.length+cw.length); if (j >= 0.4) return Math.floor(60 + j*20); }
  return 0;
}
function cleanName(n){
  let s = n.replace(/【[^】]*】/g,' ').split(/[-–—:：]/)[0];
  s = s.replace(/(多开|美化|纯净|官替|砸壳|破解|解锁|需授权|内购|免拨卡|去水印|修改器|汉化|辅助|国际服|国服|日服|韩服|台服|台湾服|越南服|整合包|第三方|开心版|端游移植|内置IGG|官方版|正式版)/g,' ');
  s = s.replace(/[（(][^）)]*[）)]/g,' ').replace(/\s+/g,' ').trim();
  return s || n.trim();
}

  }
  return '<div class="shots">' + m.sh.slice(0,8).map(u => '<img loading="lazy" src="'+esc(u)+'" onerror="this.remove()" alt="截图">').join('') + '</div>'
    + '<div class="shots-note">'+note+'</div>';
}

function renderModal(it, idx){
  curIt = it;
  const cc = catColor(it.t);
  const sz = fmtSize(it.s);
  modal.innerHTML =
    '<div class="m-head">'
    + '<button class="m-close" id="mclose">✕</button>'
    + '<div class="m-title-row">'
    + '<div class="m-icon" id="m-icon" style="background:'+(it.col||'var(--acc)')+'">'+esc(it.n.trim()[0]||'?')+appIcon(it)+'</div>'
    + '<div class="m-titles"><div class="m-name">'+esc(it.n)+'</div>'
    + (it.sub ? '<div class="m-sub">'+esc(it.sub)+'</div>' : '')
    + '<div class="m-badges"><span class="badge v">v'+esc(it.v)+'</span>'
    + srcBadge(it)
    + '<span class="badge cat" style="--cc:'+cc+';color:'+cc+'">'+CAT_MAP[it.t]+((it.c && it.c !== CAT_MAP[it.t])?' · '+esc(it.c):'')+'</span>'
    + (sz?'<span class="badge">'+sz+'</span>':'')
    + '<span class="badge">更新 '+esc(it.dt||'')+'</span>'
    + (it.lock==='1'?'<span class="badge" style="color:#fbbf24">需解锁</span>':'')
    + '</div></div></div></div>'
    + '<div class="m-body">'
    + (it.ld ? '<div class="m-sec"><h3>应用介绍</h3><div class="m-intro">'+esc(it.ld)+'</div></div>' : '')
    + (it.d ? '<div class="m-sec"><h3>破解 / 版本说明</h3><div class="m-hack">'+esc(it.d)+'</div></div>' : '')
    + '<div class="m-sec"><h3>官方截图（App Store 原版）</h3><div id="shots-box">'
    + (it.m ? shotsHtml(it.m) : '<div class="shot-loading"><span class="spin"></span>正在搜索原版应用截图…</div>')
    + '</div></div>'
    + '<div class="m-sec"><h3>相关链接</h3><div class="m-links" id="m-links">'+favBtnHtml(it)+'</div></div>'
    + '</div>';
  overlay.classList.add('show');
  document.getElementById('mclose').onclick = closeDetail;
  const favBtnEl = document.getElementById('m-fav');
  if (favBtnEl) favBtnEl.onclick = modalFavAction;
  const iconEl = document.getElementById('m-icon');
  const linksEl = document.getElementById('m-links');
  if (it.dl) {
    linksEl.innerHTML += '<a class="m-btn pri" target="_blank" rel="noopener" href="'+esc(it.dl)+'">⬇ 下载 IPA'+(it.lz==='1'?'（蓝奏云）':'')+'</a>';
  }
  if (it.m) {
    var linkTxt = it.m.cc === 'Steam' ? 'Steam 商店页面' : (it.m.cc === 'GitHub' ? 'GitHub 开源仓库' : 'App Store 原版页面');
    linksEl.innerHTML += '<a class="m-btn" target="_blank" rel="noopener" href="'+esc(it.m.url)+'">'+linkTxt+'</a>';
  } else {
    linksEl.innerHTML += '<span class="m-empty-link">IPA 在源站内（需通过签名工具添加源后安装）</span>';
    const term = cleanName(it.n);
    const box = document.getElementById('shots-box');
    const tryC = (country) => {
      itunesSearch(term, country, data => {
        const rs = data && data.results ? data.results : [];
        let pick = null, best = 55;
        for (const r of rs) {
          if (!r.screenshotUrls || !r.screenshotUrls.length) continue;
          const sc = rscore(term, r.trackName);
          if (sc > best) { best = sc; pick = r; }
        }
        if (pick) {
          const m = {sh: pick.screenshotUrls.slice(0,8), nm: pick.trackName, ar: pick.artistName, art: pick.artworkUrl512||pick.artworkUrl100, url: pick.trackViewUrl, cc: country, id: ''};
          box.innerHTML = shotsHtml(m);
          if (!iconEl.querySelector('img')) iconEl.innerHTML = '<img src="'+esc(m.art)+'" alt="">';
          var lt = m.cc === 'Steam' ? 'Steam 商店页面' : (m.cc === 'GitHub' ? 'GitHub 开源仓库' : 'App Store 原版页面');
          linksEl.innerHTML += '<a class="m-btn" target="_blank" rel="noopener" href="'+esc(m.url)+'">'+lt+'</a>';
        } else if (country === 'CN') { tryC('US'); }
        else if (country === 'US') { tryC('JP'); }
        else {
          box.innerHTML = '<div class="m-empty-link">未匹配到原版截图，<a target="_blank" rel="noopener" href="https://apps.apple.com/cn/search?term='+encodeURIComponent(term)+'">点此在 App Store 搜索「'+esc(term)+'」查看</a></div>';
        }
      });
    };
    tryC('CN');
  }
}

function openDetail(it){ if (it) renderModal(it); }

/* ── 导出 / 导入 ── */
document.getElementById('btn-export').onclick = () => {
  const n = favCount();
  if (!n){ toastMsg('还没有收藏，无内容可导出'); return; }
  const txt = JSON.stringify(FAVS);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([txt], {type:'application/json'}));
  a.download = 'goipa收藏备份_'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>toastMsg('已导出 '+n+' 条（文件+剪贴板）')).catch(()=>toastMsg('已导出 '+n+' 条（下载文件）'));
  } else toastMsg('已导出 '+n+' 条（下载文件）');
};
document.getElementById('btn-import').onclick = () => {
  const s = prompt('粘贴之前导出的收藏JSON（手机/电脑同步）：');
  if (!s) return;
  try {
    const d = JSON.parse(s.trim());
    let cnt = 0;
    for (const k in d){ if (d[k] && d[k].n){ FAVS[d[k].n] = d[k]; cnt++; } }
    saveFavs(); renderPills(); render(true);
    toastMsg('已导入 '+cnt+' 条收藏');
  } catch(e){ alert('JSON 解析失败，请检查粘贴内容是否完整'); }
};

renderChips(); renderPills(); render(true);
</script>
