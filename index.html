const CATS = [{"id": "2", "label": "游戏", "count": 1906}, {"id": "1", "label": "应用", "count": 249}, {"id": "4", "label": "工具", "count": 50}, {"id": "3", "label": "影音", "count": 13}, {"id": "5", "label": "插件", "count": 4}, {"id": "0", "label": "其他", "count": 1}];
const CAT_MAP = {"2": "游戏", "1": "应用", "4": "工具", "3": "影音", "5": "插件", "0": "其他"};
const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hi = (s, kw) => { s = esc(s); if (!kw) return s;
  return s.replace(new RegExp(kw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'), m => '<mark>'+m+'</mark>'); };

const state = { kw:'', cat:'all' };
const grid = document.getElementById('grid');
const info = document.getElementById('info');
const emptyEl = document.getElementById('empty');

function catColor(t){ return getComputedStyle(document.documentElement).getPropertyValue('--c'+t).trim() || '#3a4157'; }

function renderChips(){
  document.getElementById('chips').innerHTML = CATS.map(c =>
    '<div class="chip"><span class="dot" style="background:'+catColor(c.id)+'"></span>'+c.label+' <b>'+c.count+'</b></div>').join('')
    + '<div class="chip"><span class="dot" style="background:#a78bfa"></span>合计 <b>'+DATA.length+'</b></div>';
}

function renderPills(){
  const p = document.getElementById('pills');
  p.innerHTML = '<div class="pill'+(state.cat==='all'?' on':'')+'" data-cat="all">全部 <small>'+DATA.length+'</small></div>'
    + CATS.map(c => '<div class="pill'+(state.cat===c.id?' on':'')+'" data-cat="'+c.id+'">'+c.label+' <small>'+c.count+'</small></div>').join('');
  p.querySelectorAll('.pill').forEach(el => el.onclick = () => {
    state.cat = el.dataset.cat; renderPills(); render();
  });
}

function render(){
  const kw = state.kv = state.kw.trim().toLowerCase();
  const list = DATA.filter(it =>
    (state.cat==='all' || it.t===state.cat) &&
    (!kw || (it.n+' '+it.v+' '+it.d).toLowerCase().includes(kw)));
  grid.innerHTML = list.map(it => {
    const cc = catColor(it.t);
    return '<div class="card" style="--cc:'+cc+'">'
      + '<div class="card-top"><div class="card-name">'+hi(it.n, kw)+'</div>'
      + '<span class="card-ver">v'+hi(it.v, kw)+'</span></div>'
      + '<div class="card-meta"><span class="tag">'+CAT_MAP[it.t]+'</span> · '+esc(it.c||'')+'</div>'
      + '<div class="card-desc">'+hi(it.d, kw)+'</div>'
      + '<div class="card-hint">点击卡片展开说明</div></div>';
  }).join('');
  emptyEl.style.display = list.length ? 'none' : 'block';
  info.innerHTML = '显示 <b>'+list.length+'</b> / '+DATA.length+' 个' + (kw ? ' · 关键词「'+esc(state.kw)+'」' : '');
}

grid.addEventListener('click', e => {
  const c = e.target.closest('.card'); if (c) c.querySelector('.card-desc').classList.toggle('open');
});

const q = document.getElementById('q');
q.addEventListener('input', () => { state.kw = q.value; render(); });
document.getElementById('clear').onclick = () => { q.value=''; state.kw=''; render(); q.focus(); };
document.addEventListener('keydown', e => {
  if (e.key==='/' && document.activeElement!==q){ e.preventDefault(); q.focus(); }
  if (e.key==='Escape'){ q.value=''; state.kw=''; render(); }
});

const topBtn = document.getElementById('top-btn');
topBtn.onclick = () => window.scrollTo({top:0,behavior:'smooth'});
window.addEventListener('scroll', () => topBtn.style.display = scrollY>400 ? 'block':'none');

renderChips(); renderPills(); render();
